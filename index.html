<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Image Slider</title>
</head>

<body>

    <div class="slider-frame">
        <div class="slider">
            <div class="slider-track">

                <div class="slide"><img src="images/profile.jpg" alt="profile"></div>
                <div class="slide"><img src="images/Spongebob.jpg" alt="Spongebob"></div>
                <div class="slide"><img src="images/Stitch.jpeg" alt="Stitch"></div>
                <div class="slide"><img src="images/Nobita.jpeg" alt="Nobita"></div>
                <div class="slide"><img src="images/Disney.jpg" alt="Disney"></div> 
            </div>

            <button class="slider-btn prev">❮</button>
            <button class="slider-btn next">❯</button>
        </div>
    </div>

    <div class="slider-dots"></div>

</body>
</html>
