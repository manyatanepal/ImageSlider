<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>

    <div class="slider">

        <div class="slider-track">

            <div class="slide"> <img src="images/Disney.jpeg" alt="Slide 1"></div>
            <div class="slide"> <img src="images/Tulip.jpeg" alt="Slide 2"></div>
            <div class="slide"> <img src="images/Nobita.jpeg" alt="Slide 3"></div>
            <div class="slide"> <img src="images/Panda.jpg" alt="Slide 4"></div>
            <div class="slide"> <img src="images/Stitch.jpeg" alt="Slide 5"></div>
        </div>

        <button class="slider-btn prev">❮</button>
        <button class="slider-btn next">❯</button>
    </div>
    <div class="slider-dots"> </div>

</body>
</html>
